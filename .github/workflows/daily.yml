name: Daily News Update

on:
  schedule:
    - cron: '0 10 * * *'   # 18:00 Beijing time
  workflow_dispatch:         # manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate news
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
        run: python generate_news.py

      - name: Setup Pages
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          if [ -d archive ]; then cp -r archive _site/archive; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait 60s before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment2
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait 60s before retry 2
        if: steps.deployment2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (attempt 3)
        uses: actions/deploy-pages@v4

      - name: Commit archive to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/
          git diff --staged --quiet || git commit -m "Archive $(date +%Y-%m-%d)"
          git push
